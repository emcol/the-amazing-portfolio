<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Stylised Dolomite mountains under a clouded sky — Alta Badia">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0b0e"/>
      <stop offset="0.45" stop-color="#15171c"/>
      <stop offset="0.72" stop-color="#23262d"/>
      <stop offset="1" stop-color="#2f333b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.68" cy="0.34" r="0.5">
      <stop offset="0" stop-color="#d7e9a8" stop-opacity="0.5"/>
      <stop offset="0.35" stop-color="#abb78a" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#abb78a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f333b" stop-opacity="0"/>
      <stop offset="1" stop-color="#3a3f48" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d424b"/>
      <stop offset="1" stop-color="#30343c"/>
    </linearGradient>
    <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2e35"/>
      <stop offset="1" stop-color="#1f2229"/>
    </linearGradient>
    <linearGradient id="m3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181b21"/>
      <stop offset="1" stop-color="#101216"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8f135" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c8f135" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c8f135" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <!-- Clouds (soft blurred bands) -->
  <g filter="url(#soft)" opacity="0.5">
    <ellipse cx="430" cy="210" rx="360" ry="58" fill="#aeb4bd" opacity="0.30"/>
    <ellipse cx="980" cy="150" rx="300" ry="42" fill="#c2c7cf" opacity="0.22"/>
    <ellipse cx="1280" cy="300" rx="420" ry="64" fill="#9aa0aa" opacity="0.26"/>
    <ellipse cx="240" cy="360" rx="280" ry="46" fill="#b6bcc4" opacity="0.18"/>
  </g>

  <!-- Far range -->
  <path d="M0 560 L210 470 L360 540 L520 430 L700 545 L900 455 L1080 560 L1300 470 L1480 545 L1600 500 L1600 900 L0 900 Z" fill="url(#m1)"/>
  <rect width="1600" height="900" fill="url(#haze)"/>

  <!-- Mid range with an accent rim-lit ridge -->
  <path d="M0 640 L260 520 L470 640 L660 505 L520 430 L700 545 L760 590 L980 470 L1180 640 L1360 520 L1600 615 L1600 900 L0 900 Z" fill="url(#m2)"/>
  <path d="M660 505 L520 430 L700 545" stroke="url(#ridge)" stroke-width="3" fill="none"/>
  <path d="M980 470 L1180 640" stroke="url(#ridge)" stroke-width="2.5" fill="none" opacity="0.7"/>

  <!-- Near range (darkest) -->
  <path d="M0 760 L300 640 L560 770 L820 600 L1060 780 L1320 650 L1600 770 L1600 900 L0 900 Z" fill="url(#m3)"/>

  <!-- Snow hints on peaks -->
  <g fill="#e9ecef" opacity="0.5">
    <path d="M820 600 L860 640 L800 648 Z"/>
    <path d="M520 430 L552 470 L492 476 Z"/>
  </g>

  <!-- Internal grain for texture -->
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.06"/>
</svg>
